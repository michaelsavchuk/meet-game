<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet Game Trailer</title>
  <style>
    :root { --bg: #1d1f27; --panel: #272a35; --line: #363a48; --text: #e8e8f0; --muted: #8b90a5; --accent: #4f7cff; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif;
      display: flex; flex-direction: column; }
    header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel);
      border-bottom: 1px solid var(--line); }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 6px;
      padding: 6px 14px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    #status { color: var(--muted); }
    main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    /* The game's canvas is 1280×720 whatever the frame's size, so the recording is too. */
    iframe { display: block; width: min(100%, calc((100vh - 50px) * 16 / 9)); aspect-ratio: 16 / 9; border: 0; background: #000; }
  </style>
</head>
<body>
  <!-- Dev only (left out of npm run package and build:web). Plays a scripted trailer in the game (src/trailer.js) and
       records the canvas; with `npm run trailer` running, each take becomes dist/trailer.mp4. Keep this tab
       visible while it runs: the game pauses in a background tab. -->
  <header>
    <button id="record">Record</button>
    <button id="rehearse">Rehearse</button>
    <span id="status">Loading…</span>
  </header>
  <main><iframe id="game" src="/index.html?local" title="Game"></iframe></main>
  <script type="module" src="/src/trailer.js"></script>
</body>
</html>
