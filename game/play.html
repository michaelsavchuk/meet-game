<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Meet Game</title>
  <style>
    @font-face { font-family: 'Noto Color Emoji'; src: url('fonts/Noto-COLRv1.ttf') format('truetype'); }
    :root {
      --bg: #1d1f27; --panel: #272a35; --line: #363a48; --text: #e8e8f0; --muted: #8b90a5;
      --accent: #4f7cff; --bad: #e66;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
    main { max-width: 560px; height: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 20px; }
    .pill { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
    .pill.bad { color: var(--bad); }
    .muted { color: var(--muted); }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
    button.link { background: none; color: var(--muted); padding: 0; font-weight: 400; text-decoration: underline; }
    emoji-picker { width: 100%; height: 320px; --border-radius: 10px; --background: var(--bg);
      --border-color: var(--line); --num-columns: 8; --emoji-size: 1.6rem;
      --category-emoji-size: 1.25rem; --category-emoji-padding: 0.4rem;
      --emoji-font-family: 'Noto Color Emoji', sans-serif; }
    #feed { flex: 1; min-height: 120px; overflow-y: auto; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
    #feed li b { font-weight: 600; }
    #feed li.mine b { color: var(--accent); }
    #play { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
    #join[hidden], #play[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Meet Game</h1>
      <span id="status" class="pill">connecting…</span>
    </header>

    <!-- Step 1: pick a display name (it's the player key in the game). -->
    <section id="join">
      <p style="margin-top: 0">Pick a name to play with. Watch the game on the shared screen.</p>
      <form id="name-form">
        <input id="name" maxlength="30" placeholder="Your name" autocomplete="nickname" required>
        <button>Join</button>
      </form>
    </section>

    <!-- Step 2: chat (join / type words) and react (change your character). -->
    <div id="play" hidden>
      <div class="muted">Playing as <b id="me" style="color: var(--text)"></b> · <button id="rename" class="link">change</button></div>
      <section style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
        <ul id="feed"><li class="muted">Say anything to join. In battle, type someone's word to attack.</li></ul>
      </section>
      <form id="chat-form">
        <input id="text" placeholder="Type a message or a word…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
        <button>Send</button>
      </form>
      <section>
        <div class="muted" style="font-size: 13px; margin-bottom: 8px;">React to change your character</div>
        <emoji-picker id="picker" class="dark" data-source="vendor/emoji-picker/data.json"></emoji-picker>
      </section>
    </div>
  </main>

  <!-- Emoji picker for reactions (vendored, see `npm run vendor`). -->
  <script type="module" src="vendor/emoji-picker/index.js"></script>
  <script>
    // Stand-in for Meet chat and reactions: posts the same raw payloads the extension does, so the
    // server and game can't tell the difference. Players are keyed by display name, like in Meet.
    const $ = (id) => document.getElementById(id);
    // crypto.randomUUID only exists on secure origins, and players may reach this over plain http on a LAN.
    const uid = () => crypto.randomUUID?.() ?? `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

    const store = {
      get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    };
    const userId = store.get('play.userId') ?? uid();
    store.set('play.userId', userId);
    let name = store.get('play.name');

    function showPlay() {
      $('join').hidden = !!name;
      $('play').hidden = !name;
      $('me').textContent = name;
      (name ? $('text') : $('name')).focus();
    }

    async function post(path, body) {
      try {
        const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!res.ok) throw new Error(res.status);
      } catch {
        setStatus(false);
      }
    }

    $('name-form').addEventListener('submit', (e) => {
      e.preventDefault();
      name = $('name').value.trim();
      if (!name) return;
      store.set('play.name', name);
      showPlay();
    });

    $('rename').addEventListener('click', () => {
      $('name').value = name;
      name = null;
      showPlay();
    });

    $('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('text').value.trim();
      if (!text) return;
      $('text').value = '';
      post('messages', { id: uid(), userId, sender: name, text, receivedAt: new Date().toISOString() });
    });

    $('picker').addEventListener('emoji-click', (e) =>
      post('reactions', { emoji: e.detail.unicode, participantId: userId, sender: name, receivedAt: new Date().toISOString() }));

    // ---- Feed: everyone's chat, from the same event stream the game reads ----
    function setStatus(ok) {
      $('status').textContent = ok ? 'connected' : 'disconnected';
      $('status').classList.toggle('bad', !ok);
    }

    function addToFeed(event) {
      const feed = $('feed');
      const li = document.createElement('li');
      if (event.player.name === name) li.className = 'mine';
      const who = document.createElement('b');
      who.textContent = event.player.name;
      li.append(who, event.type === 'chat' ? `: ${event.text}` : ` reacted ${event.emoji}`);
      const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
      feed.append(li);
      while (feed.children.length > 100) feed.firstElementChild.remove();
      if (atBottom) feed.scrollTop = feed.scrollHeight;
    }

    const source = new EventSource('events');
    source.onopen = () => setStatus(true);
    source.onerror = () => setStatus(false);
    source.onmessage = (e) => addToFeed(JSON.parse(e.data));

    showPlay();
  </script>
</body>
</html>
