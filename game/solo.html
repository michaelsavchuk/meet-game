<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meet Game Solo</title>
  <style>
    :root {
      --bg: #1d1f27; --panel: #272a35; --line: #363a48; --text: #e8e8f0; --muted: #8b90a5; --accent: #4f7cff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif;
      display: flex; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #game { flex: 1; min-width: 0; background: #000; }
    aside { width: 420px; flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--line); }
    nav { display: flex; background: var(--panel); border-bottom: 1px solid var(--line); }
    nav button { flex: 1; font: inherit; font-weight: 600; color: var(--muted); background: none; border: 0;
      border-bottom: 2px solid transparent; padding: 12px; cursor: pointer; }
    nav button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .panes { flex: 1; min-height: 0; }
    .panes iframe[hidden] { display: none; }
    #help-button { position: fixed; top: 10px; left: 10px; z-index: 1; width: 34px; height: 34px; border-radius: 50%;
      font: 700 18px/1 system-ui, sans-serif; color: var(--text); background: rgb(39 42 53 / 0.85);
      border: 1px solid var(--line); cursor: pointer; }
    #help-button:hover { border-color: var(--accent); }
    dialog { max-width: min(460px, calc(100vw - 32px)); padding: 24px; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px; }
    dialog::backdrop { background: rgb(0 0 0 / 0.6); }
    dialog h2 { margin: 0 0 12px; font-size: 20px; }
    dialog ol { margin: 0 0 16px; padding-left: 22px; }
    dialog li + li { margin-top: 8px; }
    dialog p { margin: 0 0 20px; color: var(--muted); }
    dialog a { color: var(--accent); }
    dialog form { display: flex; justify-content: flex-end; margin: 0; }
    dialog form button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
      border-radius: 8px; padding: 8px 18px; cursor: pointer; }
    /* Narrow windows: game on top at 16:9, tabs below. */
    @media (max-width: 800px) {
      body { flex-direction: column; }
      #game { flex: none; aspect-ratio: 16 / 9; height: auto; }
      aside { width: auto; flex: 1; min-height: 0; border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <!-- Everything on one page for playing alone without Meet or a server: the game, the play page (you) and the
       control page (start, CPUs). ?local makes the game and play page talk over a BroadcastChannel (bridge.js), so
       this also works as a static site (npm run build:web, which serves this page as index.html and renames the game
       to game.html). Full file names, so the frames load on any static host. -->
  <iframe id="game" src="/index.html?local" title="Game"></iframe>
  <aside>
    <nav role="tablist">
      <button role="tab" data-pane="play">Chat Sim</button>
      <button role="tab" data-pane="control">Game Control</button>
    </nav>
    <div class="panes">
      <iframe id="play" src="/play.html?local" title="Play"></iframe>
      <iframe id="control" src="/control.html" title="Control"></iframe>
    </div>
  </aside>
  <button id="help-button" type="button" aria-label="Help" title="Help">?</button>
  <dialog id="help" aria-labelledby="help-title">
    <h2 id="help-title">Quick Start</h2>
    <ol>
      <li>Use the <strong>Game Control</strong> tab to configure the game, add CPUs, and start the game.</li>
      <li>Use the <strong>Chat Sim</strong> tab to participate in the game yourself.</li>
    </ol>
    <p>For more information, check out the project on
      <a href="https://github.com/michaelsavchuk/meet-game" target="_blank" rel="noopener">GitHub</a>.</p>
    <form method="dialog"><button autofocus>Got it</button></form>
  </dialog>
  <script src="/src/solo.js"></script>
</body>
</html>
